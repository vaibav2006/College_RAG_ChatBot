<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef4ff;color:#172033}

<body>
<div class="app">

    <h1>MEPCO Schlenk Engineering College — RAG Chatbot</h1>

  <div id="chat" class="chat"></div>

  <div class="examples">
    <button class="example" onclick="ask('What is the vision of the institution?')">Institution vision</button>

<script>

wn corporate businesses and also providing social services through many educational institutions in backward districts like Virudhunagar and Madurai. o Currently Shri.A.Ramamurthy, Sri.A.Tenzing and Dr.S.Arivazhagan serve a s the President, Correspondent and Principal of the college respectively. Approval and Affiliation ▪ Approved institute by AICTE, UGC and affiliated to the Anna University, Chennai ▪ The college was affiliated to Madurai Kamaraj University, Madurai from the inception in 1984 to 2001 - 2002 and later affiliated to the Anna University, Chennai from 2002 - 2003. ▪ The Institute has been conferred Autonomous Status by University Grants Commission (UGC), New Delhi from the Academic Year 2013-2014. Accreditation and Rankings ❖ 7 UG Engineering courses are accredited under Tier I"}, {"source": "Institutional Development Plan 2024–2029", "page": 3, "text": "by University Grants Commission (UGC), New Delhi from the Academic Year 2013-2014. Accreditation and Rankings ❖ 7 UG Engineering courses are accredited under Tier I by the National Board of Accreditation (NBA), New Delhi. ❖ 6 PG courses are also accredited by the National Board of Accreditation (NBA), New Delhi. ❖ Accredited by National Assessment and Accreditation Council (NAAC) with A Grade for two consecutive cycles. ❖ Ranked in 101 to 150 Band by National Institute Ranking Framework NIRF 2024."}, {"source": "Institutional Development Plan 2024–2029", "page": 4, "text": "Page 4 of 40 \\ Vision “Envisioning a world led by our Engineers holding a beacon of hope and confidence for generations to come” Mission “To Produce Competent, Disciplined and Quality Engineers and Administrators through Service Par Excellence” Motto “Work is Worship”"}, {"source": "Institutional Development Plan 2024–2029", "page": 5, "text": "Page 5 of 40 Institution SWOC Strength Opportunities o 41 years of existence with quality educational service offerings o Academic and Administrative Freedom to the Principal o Magnanimous aborative Research in emerging areas Weakness Challenges o Rural locale o Less student diversity o Private, for-profit Deemed Universities o Shift in focus on numerical achievement vs. qualitative achievement o Development of new colleges and courses in the nearby location o Eroding glamour of Engineering Education o Changing interests, expectations and preferences of current generation"}, {"source": "Institutional Development Plan 2024–2029", "page": 6, "text": "Page 6 of 40 Institutional Development Plan (IDP) The institute has a systematic approach in Governing the functions and activities both for long term and short term. It has a clearly defined hierarchy in the Administrative Structure as follows, The institute adopts a stakeholders driven system of Policy Development & Academic and Administrative Management with an integration of Autonomy and Accountability. The entire Academic progression is based on “Outcome Based Education in Technical and Management E ducation” which is assured by the adoption of a Quality Assurance Model (QAM) developed by the Internal Quality Assurance Cell (IQAC) of the college. The QA Model is given below."}, {"source": "Institutional Development Plan 2024–2029", "page": 7, "text": "Page 7 of 40 There is an Academic Organizational Structure for assuring Quality in Education."}, {"source": "Institutional Development Plan 2024–2029", "page": 8, "text": "Page 8 of 40 STRATEGIC AND DEVELOPMENT GOALS FOR 2024 - 2029 In line with the Vision and the Mission of the College, the Strategic and Development Goals for the period of 2024 to 2029 has been formulated as follows with the Desired Outcomes of • Effective Education • Employable Graduates • Realized Mission • Achieved Outcomes • Satisfaction of Stakeholders Major Areas Objectives Strategy Institute To take the institute to the level of Degree Awarding Institute / University Broadening and Aligning the Course offerings suitably with necessary legal and statutory compliances Programs To begin New programs/Courses on • M.Tech. in Artificial Intelligence and Machine Learning • M.Tech. in Data Science • M.Tech. in IOT To diversify the Course Offerings based on the recent developments and requirements Expand the Faculty base on these related areas and apply to the authorities"}, {"source": "Institutional Development Plan 2024–2029", "page": 8, "text": "To diversify the Course Offerings based on the recent developments and requirements Expand the Faculty base on these related areas and apply to the authorities Creation of Center of Excellence Developing more Collaboration with Leading Corporate and Research Institutes Creating state of art facilities in association with those industries and research institutes Infrastructure Making the Campus and Academic Activities contributing to UN Sustainable Development Goals (SDGs) Green, Safe and Sustainable Environment Making the Courses more social relevant and environment focused Inclusion of contents in courses relevant to SDGs Planting more trees and creation of medicinal plant garden Treating the waste water Installing online weather station Encouraging less emission vehicles."}, {"source": "Institutional Development Plan 2024–2029", "page": 9, "text": "Page 9 of 40 Major Areas Objectives Strategy Installing more solar power plants. Using battery operated vehicles inside the campus. Creating a State of Art Swimming Pool for training the students Allocating funds for the same Ensuring High speed connectivity Installation of required equipment with budget allocation Improved Amenities and schooling facilities for Residential Faculty members families Augmenting facilities through allocation of funds in a phased manner Learning Resources Creating a state of art Studio for preparing Digital Learning Resources Prepare a proposal for funding by organizations like DST with institute contribution under partnership scheme Skill Upgradation Encouragement for more FDPs, SDPs, STTPs, Fellowships, Exchange programs, Summer/Winter Schools Financial and administrative support to faculty Encouragement for students to undertake internship abroad with Foreign Corporate, Institutions and Universities Associating with Corporate organizations, R & D organizations and Premier Institutes R &"}, {"source": "Institutional Development Plan 2024–2029", "page": 9, "text": "for students to undertake internship abroad with Foreign Corporate, Institutions and Universities Associating with Corporate organizations, R & D organizations and Premier Institutes R & D Encouraging more of full time Ph.D. scholars More recognized research centers and financial support to scholars To make 90% of faculty to qualify for Ph.D. Degree Academic support to the faculty To involve 50% of Faculty in Sponsored Research Applying for more inter- departmental projects and exploring all avenues both in India and abroad Encouraging the Faculty for getting more Patents Granted and for Commercializing those patents Financial and administrative support to the faculty Curriculum To make the curriculum flexible and to encourage cross discipline studies Thorough scanning of the popular and latest emerging areas and"}, {"source": "Institutional Development Plan 2024–2029", "page": 10, "text": "Page 10 of 40 Major Areas Objectives Strategy Improve and provide more wider range Special courses (with 1 or 2 credit ) by experts from reputed industry and institutes inclusion of them in the curriculum through Board of Studies and Academic Council More knowledge enrichment courses beyond curriculum Industry Interaction, Entrepreneurs hip and Innovation More Industry - Institute interaction Explore all possible avenues to provide industry orientation to students and faculty members in addition to IIPC activities Promotion of Entrepreneurs and Intrapreneurs Promoting Innovation, Incubation and Startups Accelerated activities of EDIC, Mepco Incubation Centre and IIPC More functional MOUs with industry Approaching suitable Corporates National / International Recognition Increase the Visibility of the College and strive to get the highest grade from Accrediting Organizations at all levels Ensuring the Quality requirements of Accrediting Organizations through the unified efforts of Internal"}, {"source": "Institutional Development Plan 2024–2029", "page": 10, "text": "strive to get the highest grade from Accrediting Organizations at all levels Ensuring the Quality requirements of Accrediting Organizations through the unified efforts of Internal Quality Assurance Cell (IQAC) internally Institute’s Sustainability Goals in alignment with Sustainable Development Goals (SDGs) Vision \"To transform Mepco into a pioneering sustainable campus in India, leading by example in environmental stewardship, innovation, and education. We envision a net -zero carbon institution that integrates sustainability into every facet of academic and operational excellen ce while empowering generations of engineers and professionals to innovate and lead in harmony with sustainability goals and India’s green development Agenda” Mission “To cultivate a sustainability -first culture across the campus through education, innova tion, and environmentally responsible practices and to achieve operational excellence by implementing zero plastic, zero waste, zero liquid discharge, and net-zero emissions targets and engage in participatory"}, {"source": "Institutional Development Plan 2024–2029", "page": 10, "text": "environmentally responsible practices and to achieve operational excellence by implementing zero plastic, zero waste, zero liquid discharge, and net-zero emissions targets and engage in participatory programs that champion ecological stewardship, climate resilience, and inclusive sustainability.”"}, {"source": "Institutional Development Plan 2024–2029", "page": 11, "text": "Page 11 of 40 There is a separate Sustainability Steering Committee (SSC) in operation in the institute with following Key Objectives on Sustainability: 1. Promote a sustainability -first culture by integrating green values into academics, operations, and student life. 2. Strengthen sustainability education through curriculum, research, and certified learning opportunities. 3. Drive green campus operations with zero plastic, zero waste, zero liquid discharge, and net-zero goals. 4. Develop climate-resilient infrastructure based on green building and biodiversity practices. 5. Encourage responsible consumption by adopting eco-friendly procurement and circular economy habits. 6. Empower student leadership through clubs, events, and recognition of sustainability initiatives. 7. Track and audit progress using measurable goals and benchmarked sustainability reporting. 8. Foster community and industry engagement via outreach and collaborative programs. 9. Align with national and global sustainability goals including NEP 2020 and UN SDGs. 10. Build"}, {"source": "Institutional Development Plan 2024–2029", "page": 11, "text": "community and industry engagement via outreach and collaborative programs. 9. Align with national and global sustainability goals including NEP 2020 and UN SDGs. 10. Build institutional capacity with strong policies and sustainability training for staff and faculty"}, {"source": "Institutional Development Plan 2024–2029", "page": 12, "text": "Page 12 of 40 A. Governance Enablers Mepco Schlenk Engineering College was established by the Mepco Schlenk Charities, a social welfare organisation. The Institute has following entities with necessary authorities and responsibilities for ensuring seamless flow of activities for achievement of envisaged Academic and Social Mission. Each entity is given the required freedom and powers to exercise their responsibilities which forms the base for sustained and stable growth of the institution. 1. College Committee 2. Governing Body 3. Correspondent 4. Principal 5. HODs / Directors Based on the Strategic Goals formulated, the respective authorities shall frame necessary objectives at their levels and execute them through their responsibilities as vested. The Governance Enablers shall ensure the following while they perform their functions. 1. Strengthening Institutional Governance Structure for effective and timely decision making. 2. A transparent System with adequate autonomy for"}, {"source": "Institutional Development Plan 2024–2029", "page": 12, "text": "following while they perform their functions. 1. Strengthening Institutional Governance Structure for effective and timely decision making. 2. A transparent System with adequate autonomy for quick actions. 3. Assuring Quality at all levels of Education and Management 4. Developing the system inclusive with all Stakeholders participation 5. Delegating financial freedom wherever deemed 6. Confirmation of meeting the social obligations 7. Building next level leadership for sustainable development Enablers Means of achieving the goals College Committee • Responsible for carrying out all or any of the object for which Mepco Schlenk Engineering College Committee is established • Institute scholarships, fellowships, studentships, medals, prizes and certificates • To approve annual budget of the college Governing Body • Guide the institute while fulfilling the objectives for which the college has been granted autonomous status • Approve new programs of study leading to degrees"}, {"source": "Institutional Development Plan 2024–2029", "page": 12, "text": "Guide the institute while fulfilling the objectives for which the college has been granted autonomous status • Approve new programs of study leading to degrees and/or diplomas."}, {"source": "Institutional Development Plan 2024–2029", "page": 13, "text": "Page 13 of 40 Enablers Means of achieving the goals • All recruitments of Teaching Faculty/Principal shall be made by the Governing Body/state government as applicable in accordance with the policies laid down by UGC and State Government from time to time. • Perform such other functions and institute committees, as may be necessary and deemed fit for the proper development of the college Correspondent • Responsible and authorized for all routine administrative, financial and top level functions and activities related to the management of the College and Liaison between the College Committee and the college administration team. Principal • To plan, organize and coordinate all the academic and administrative activities of the college Head / Director of Departments • Administration of Department affairs in line with the Department / College Vision and Mission"}, {"source": "Institutional Development Plan 2024–2029", "page": 14, "text": "Page 14 of 40 B. Financial Enablers The Institute has professional approach in the overall financial management and in all finance related operations. All financial transactions are carried as per the regulatory and statutory requirements. The Major source of funds is Students’ Fees. Fees collected from students are used for the specific purposes for which they have been collected for. Fees include college fees from e nrolled students and hostel fees collected from inmates. Other sources include funds mobilized through: 1. Training & Consultancy offered by faculty members for organizations and other institutions 2. Sponsored Research Project grants from Government and non-Government organizations 3. Registration fees for Conferences, Seminars organized by departments 4. Industrial/Institutional Sponsorships for FDPs, Conferences, Seminars, etc. 5. Establishment of Industry Sponsored Laboratories and Centre of Excellence 6. Endowments from Management Procedure to prepare annual estimates of"}, {"source": "Institutional Development Plan 2024–2029", "page": 14, "text": "for FDPs, Conferences, Seminars, etc. 5. Establishment of Industry Sponsored Laboratories and Centre of Excellence 6. Endowments from Management Procedure to prepare annual estimates of Income and expenditure: 1. All departments propose their annual financial plans based on academic planning to the finance committee to achieve intended educational purposes and objectives. 2. The comprehensive budget proposal is placed to the College Administrative Committee for approval. 3. The proposed budget is examined and approved by the finance committee of the college each academic year. 4. The administrative and financial approvals are taken from competent authority as per college’s policy and guidelines. 5. The various heads for which budget is prepared and funds allocated, are provided in the financial guidelines given by the college. 6. While purchasing Laboratory equipment and utilities, effective monitoring is done from quotations stage to installation and commissioning"}, {"source": "Institutional Development Plan 2024–2029", "page": 14, "text": "the financial guidelines given by the college. 6. While purchasing Laboratory equipment and utilities, effective monitoring is done from quotations stage to installation and commissioning stage. 7. Any additional requirements that arise due to unforeseen expenditure shall be discussed with HoDs and management committee is requested to ratify. 8. Periodic reviews are carried out to monitor the utilization of budget. Principal conducts the review with the help of H oDs and accountant in quarterly basis and make sure that the funds are utilized effectively. The Finance committee is responsible for observance of regulations relating to maintenance of accounts of income and expenditure."}, {"source": "Institutional Development Plan 2024–2029", "page": 15, "text": "Page 15 of 40 Enablers Means of achieving the goals College Committee College committee steers the formulation and execution of development plans periodically and give a broad direction to the administrative authorities to achieve the intended plans. It provides necessary resources to realize the same. Finance Committee Budgeting of funds requirements and formulate strategies to mobilize funds to fulfill those requirements Do the allocation of funds for acquiring necessary resources based on the development plans of the institute every year Principal To plan, organize, coordinate, manage and control all financial matters related to academic, administrative and infrastructure activities HODs / Section Heads All Heads of the departments and other faculty in charges are empowered to purchase as per guidelines wit h the approval of Principal. An internal approval system for all financial transactions is in place. Internal / External Audit"}, {"source": "Institutional Development Plan 2024–2029", "page": 15, "text": "purchase as per guidelines wit h the approval of Principal. An internal approval system for all financial transactions is in place. Internal / External Audit All financial transactions of the college are made in accordance with the budget approved by the College Administrative Committee every year. All vouchers and bills are audited once in two months by an Internal Auditor appointed by the college committee. The report of internal auditors is discussed and suggestions are provided in the management committee meeting conducted every month. Books of Accounts maintained in the college are audited annually by External Qualified Chartered Accountants appointed by the College Committee and the final audited report is discussed in the Annual General Meeting of the College Committee for further actions and suggestions."}, {"source": "Institutional Development Plan 2024–2029", "page": 16, "text": "Page 16 of 40 C. Academic Enablers In Mepco Schlenk Engineering College, a holistic learning and development of students is emphasized through adoption of “Outcome Based Education” to ensure that stu dents have an edge over others in the competitive environment. Academics is taken beyond the curriculum so as to prepare the students to be adoptable to the changing technological world. In every academic activity of the campus, quali ty and standard is kept as the priority in designing and delivering process. Enablers Means to achieve goals Programs and Courses New courses shall be introduced for catering to the new technological, professional and future requirements Regulations / Curriculum / Syllabus Periodical revision of curriculum and syllabus are made through thorough scanning of industry requirements and latest developments in the respective fields Addition of more electives based on the industry demand"}, {"source": "Institutional Development Plan 2024–2029", "page": 16, "text": "syllabus are made through thorough scanning of industry requirements and latest developments in the respective fields Addition of more electives based on the industry demand Flexibility in choice of specialization and electives enabling the students for multidisciplinary studies Offering honours degree / Major / Minor specialization across disciplines Aligning with the AICTE and NEP guidelines Employability Enhancements Already a lot of offerings are given to students such as, • Value Added Courses • SWAYAM / NPTEL Courses / Spoken Tutorial • Special Courses • International Certifications • Integral Technical Training Skill Development Integrated Aptitude Training (IAT) is given t o second year & pre- final year UG and PG students to improve their Aptitude skills through an external agency . Also students are given a n Integrated Soft Skills Training (IST). The first year UG and PG students are regularly"}, {"source": "Institutional Development Plan 2024–2029", "page": 16, "text": "through an external agency . Also students are given a n Integrated Soft Skills Training (IST). The first year UG and PG students are regularly offered a Value added Course on Communication and personality Development in their I semester and II semester. Other Indian and Foreign languages are taught to the interested students in Hindi, German and Japanese."}, {"source": "Institutional Development Plan 2024–2029", "page": 17, "text": "Page 17 of 40 Enablers Means to achieve goals Resources – Faculty Members & Staff Faculty members are encouraged to get themselves more qualified and updated through NPTEL Courses, International Certifications, Courses offered by Industries, FDPs, STTPs, Conferences and other technical seminars & workshops. Getting Visiting Faculties from Corporates are in the practice. Support Staff are also given additional training and exposure to new technological developments based on requirements. Material Resources and Digital Resources The Central Library is updated on a regular basis with latest books in all disci plines. Subscription to both Print Journals and e -Journals (IEEE, ASCE, ASME, Science Direct, ProQuest, DELNET, NDLI, SWAYAM) are done and given access to all students and staff. Utilization of library resources are monitored regularly. Innovative Pedagogy Adoption of Theory Course with Lab C omponent (TCLC), Case studies, Mini projects, Continual"}, {"source": "Institutional Development Plan 2024–2029", "page": 17, "text": "and staff. Utilization of library resources are monitored regularly. Innovative Pedagogy Adoption of Theory Course with Lab C omponent (TCLC), Case studies, Mini projects, Continual Associated Internship & Experiential Learning Program are in place. International Exposure Students are encouraged to go for internship/fellowship with Foreign Universities and leading Corporates. Academic Policies / Objectives Criteria Stakeholders Involvement in Enabling Tangible Policy / Objectives Intangible Policy / Objectives General College Committee in coordination with other stakeholders Serving large number of students and other stakeholders in the area of Higher Education in Engineering, Technology and Management 1. Provision of higher education in Engineering, Technology and Management with quality and standard. 2. Implanting quality, discipline and standard in every aspect of campus life and learning as an impetus to individual development. 3. Making the Institute as Centre of Excellence."}, {"source": "Institutional Development Plan 2024–2029", "page": 18, "text": "Page 18 of 40 Criteria Stakeholders Involvement in Enabling Tangible Policy / Objectives Intangible Policy / Objectives Programs Governing Body Academic Council Board of Studies HODs / Faculty / Staff 1. Success Rate of program Completion 2. Pass Percentage 3. Rank Holders and Distinctions\\ 4. Attainment of PEOs Provision of Program Educational Objectives (PEOs) that are consistent with the mission of the institution, the needs of program’s various constituents, and relevant criteria. Students Students HODs Faculty Staff 1. Successful Completion of the program with High percentage 2. Academic Excellence a. Achieving 100% Results b. Maximum Ranks c. Placement Offers 3. Attainment of CO/POs 4. Higher Education 5. Co-curricular Excellence 6. Extracurricular Excellence 7. National/International level participation To assure student performance by all means to their satisfaction, advise the students regarding curricular and career matters, and monito r students’ progress to"}, {"source": "Institutional Development Plan 2024–2029", "page": 18, "text": "participation To assure student performance by all means to their satisfaction, advise the students regarding curricular and career matters, and monito r students’ progress to foster their success in achieving Program Outcomes, thereby enabling them as graduates to attain Program Educational Objectives. Faculty All Faculty Members / HODs 1. Results 2. Academic Research 3. Sponsored Research 4. Publications 5. Patents 6. IPR 7. Consultancy 8. Seminars/Conferences/QIPs – organization and participation 9. Interaction with Outside World To ensure overall development of Faculty with Career Growth and Knowledge updating."}, {"source": "Institutional Development Plan 2024–2029", "page": 19, "text": "Page 19 of 40 Criteria Stakeholders Involvement in Enabling Tangible Policy / Objectives Intangible Policy / Objectives Graduates Graduates Employers Parents Attainment of PEOs ng attained. The results of these evaluations must be systematically utilized as input for continuous improvement of the program."}, {"source": "Institutional Development Plan 2024–2029", "page": 21, "text": "Page 21 of 40 D. Research and Intellectual Property Enablers Research become an integral part of the Institute’s pursuit towards quality and contributory education. A general policy of our institution is that, teaching and research should go hand in hand so that ideas can be exchanged freely among faculty and students. The college's research activities are performed as an integral part of the on -going educational program, and these activities often form the basi s of teaching to expose our students to modern aspects of science and technology while exploring the practical utility of research inventions for the benefit of common man. Moreover, the fruit of research are translated into national and international pate nts, articles in peer reviewed journals, seminar reports, presentations at professional meetings, and student dissertations and theses. Enablers Means to achieve goals Faculty Provision of incentives"}, {"source": "Institutional Development Plan 2024–2029", "page": 21, "text": "articles in peer reviewed journals, seminar reports, presentations at professional meetings, and student dissertations and theses. Enablers Means to achieve goals Faculty Provision of incentives to improve research performance and stimulate faculty members into continued research. Research publications by a faculty member in either Web of Science or Scopus-indexed journals are appreciated with appropriate incentives. Incentives are also provided for acquiring sponsored research projects from Governme nt / Private funding bodies. The College has incentivized faculty members / research teams that have created IPR assets (Filing / Registration / Granting) by meeting all expenditure and reward for their exemplary works. Quality Research Quality Research is focused in the institute by ensuring originality, relevance to the field & society, robust methodology and meeting ethical standards. There is a mechanism to approve publications and patents done by the staff and to check"}, {"source": "Institutional Development Plan 2024–2029", "page": 21, "text": "field & society, robust methodology and meeting ethical standards. There is a mechanism to approve publications and patents done by the staff and to check for plagiarism. Publications in indexed and highly cited Journals are encouraged and emphasized. Students in Research Ph.D. scholars are required to mandatorily publish their work in peer reviewed journals. PG and UG students are also encouraged to publish their project work in indexed journals. Research Advisory Committee Academic Research Committee a) Promotes campus research activities by nurturing scientific temper among its faculty and students b) Formulates research policies, coordinating scholarly activities and exploring new avenues for future research projects. c) Guides the college administration and faculty on project application, administration, execution and completion. Sponsored Research Committee"}, {"source": "Institutional Development Plan 2024–2029", "page": 22, "text": "Page 22 of 40 Enablers Means to achieve goals Institute Innovation Council (IIC) • To regularly conduct IIC driven activities, self-driven activities and celebration activities throughout the year. • To upload reports of all activities and IIC annual report in the IIC web portal periodically. • To coordinate training of innovation ambassadors and updating their roles in IIC web portal. • To conduct prescribed activities for chosen mentee institutions and ATL schools. • To maintain a repository of innovations and start-ups developed by faculty members, students, alumni and incubated start-ups under the banner of YUKTI-National Innovation Repository (NIR). • To coordinate and organize Technoinnovate Project Contest at department and institution level. • To invite student project scheme (SPS) proposals from aspiring students and conducting reviews. • To coordinate and uploading of data for Atal Ranking of Institutions on Innovation Achievements."}, {"source": "Institutional Development Plan 2024–2029", "page": 22, "text": "project scheme (SPS) proposals from aspiring students and conducting reviews. • To coordinate and uploading of data for Atal Ranking of Institutions on Innovation Achievements. • NISP Policy Adoption & Implementation Research Promotion Policy A policy document related to Publications, Projects, Patents and Consultancy is in place which provides guidelines to the staff. Ethics in Research There is an Ethics Committee which takes care of the following in the institute. • Advising, guiding, and governing the MSEC academic/research community on all issues/disputes relating to the conduct of academic/research and following academic/research ethics. • Assisting the Academic Council in framing/updating the ‘Code of Ethics in Academic/Research Practices. • Guiding and supporting faculty, research scholars and students on ethical issues pertinent to teaching, research/academic activities. • Guiding the faculty, research scholars and students in publishing their research outcomes in legitimate journals and"}, {"source": "Institutional Development Plan 2024–2029", "page": 22, "text": "on ethical issues pertinent to teaching, research/academic activities. • Guiding the faculty, research scholars and students in publishing their research outcomes in legitimate journals and guide them in distinguishing predatory journals from legitimate ones. • Investigating and counselling issues regarding research ethics and misconduct."}, {"source": "Institutional Development Plan 2024–2029", "page": 23, "text": "Page 23 of 40 Enablers Means to achieve goals • Protecting the whistle-blowers against any retaliatory actions by those who are involved in research/academic misconduct. • Recommending/imposing disciplinary actions for scientific misconduct after an investigation. Mepco Incubation Centre (MIC) • To establish more technology oriented start-ups among students, faculty, Alumni and other aspirants. • To seek and facilitate adequate funding from Government and other financial institutions • To conduct capacity building workshops in various technological domains and inculcating entrepreneurial culture inside the campus. • To impart Managerial training to Entrepreneurs in need based areas such as Financial/Working Capital Management, Digital Marketing, IPR, Supply Chain Management, etc. • To explore the needs of local industries/MSME units and facilitating commercialization of academic research and grass root innovations. • To pool in accelerators, angel investors and venture capitalists by organizing pitch-in events for"}, {"source": "Institutional Development Plan 2024–2029", "page": 23, "text": "and facilitating commercialization of academic research and grass root innovations. • To pool in accelerators, angel investors and venture capitalists by organizing pitch-in events for start-ups. • To provide mentoring support and conduct periodical reviews for existing start-ups. Atal Community Innovation Centre – Mepco Innovative Foundation ACIC - Mepco Innovative Foundation (ACIC -MIF) is a Special Purpose Vehicle (SPV), a not -for-profit section 8 company, is functioning to provide an excellent framework for Innovation Ecosystem to transform the community in and around the Institution. ACIC-MIF Special Purpose Vehicle is functioning to encourage a spirit of entrepreneurship in underserved/unserved regions of India by provision of enabling infrastructure and facilitating environment for innovation. Thus, nurturing the culture of entrepreneurship in the community to overcome various societal challenges. The objective of ACIC -Mepco Innovative Foundation is to offer unique and incentivized solutions, which"}, {"source": "Institutional Development Plan 2024–2029", "page": 23, "text": "of entrepreneurship in the community to overcome various societal challenges. The objective of ACIC -Mepco Innovative Foundation is to offer unique and incentivized solutions, which will encourage students, researchers or any individual/group of individuals to ideate and design novel innovative solutions for communities in and around the"}, {"source": "Institutional Development Plan 2024–2029", "page": 24, "text": "Page 24 of 40 Enablers Means to achieve goals Atal Community Innovation centres. Moreover, creating a space for pre-incubation of ideas and solutions. With state-of-art labs, joint collaborations, equipment, makerspace, mentorship, handholding support, funding opportunities, and co - working space, ACIC -MIF ensures Innovation Ecosystem for the budding entrepreneurs. IPR (Patents and Copy Rights) and Technology Transfer It is ensured that knowledge in the form of discoveries and inventions that come out of researches conducted in our campus promptly patented. IPR is promoted among faculty to foster and protect the innovation and safeguard t he rights and interests of inventors. Further for recognizing the potential of faculty, monetary assistance is provided for filing / Publishing / Granting of Patents. Commercialization of innovations are vital in translating an academic research into a practical and marketable offering. Getting Copy Rights for Lab"}, {"source": "Institutional Development Plan 2024–2029", "page": 24, "text": "/ Granting of Patents. Commercialization of innovations are vital in translating an academic research into a practical and marketable offering. Getting Copy Rights for Lab Manuals, Instructional System Design, Case Study, Teaching Supplements is a regular practice and is highly encouraged."}, {"source": "Institutional Development Plan 2024–2029", "page": 25, "text": "Page 25 of 40 E. HR and Supportive – Facilitative Enablers A key factor for success of any organization is Human Resource Practices and HR Development. All the stakeholders are utional Development Plan 2024–2029", "page": 33, "text": "them to get exposure to the real professional development. There are 3 Professional Societies for faculty viz. ISTE, IETE and CSI. Students and Staff are made as part of any of these societies or chapters and are encouraged to participate in the regular activities which are organized every week with a stipulated schedule."}, {"source": "Institutional Development Plan 2024–2029", "page": 34, "text": "Page 34 of 40 G. Physical Enablers Since inception of the institute in 198 4, distinct focus is given to ensure the establishment and development of state -of-art Physical Infrastructure for ensuring the creation and provision of a conducive and blissful learning environment to the academic community in the campus. Enablers Means to achieve goals Campus The serene campus is spread over 195 acres and housing all necessary academic, administrative and residential facilities more than the statutory and regulatory requirements Green Environment A lot of Green initiatives are being taken on a continuous basis in the campus to maintain it green and environment friendly. Flora and fauna seen in the campus is the evidence for the efforts towards environmental sustainability. More than a lakh trees have been grown with innovative concept of Miyawaki Forestation . Recycling of water, Sewage Treatment,"}, {"source": "Institutional Development Plan 2024–2029", "page": 34, "text": "the efforts towards environmental sustainability. More than a lakh trees have been grown with innovative concept of Miyawaki Forestation . Recycling of water, Sewage Treatment, Solid waste conversion as manure are practiced for very long years. Provisions are there for 3Rs of Rain Water a) Rainwater Retention b) Rainwater Recharge c) Rainwater Reuse. LED lamps at all places and installation of Solar Power generation over the roof top of buildings are yet another green initiative followed by the institute. Plastic usage has been banned. Academic Infrastructure The campus houses separate buildings for each department which are well built very spaciously and with necessary academic facilities. They have very carefully designed structures, well illuminated and ventilated classrooms, systematically planned and arranged Lab spaces, Tutorial halls, department specific library, ergonomically designed furniture and other academic oriented amenities. Laboratories Every department ensures adherence"}, {"source": "Institutional Development Plan 2024–2029", "page": 34, "text": "classrooms, systematically planned and arranged Lab spaces, Tutorial halls, department specific library, ergonomically designed furniture and other academic oriented amenities. Laboratories Every department ensures adherence to regulatory standards by providing a satisfactory number of laboratories for practical exercises aligned with the curriculum. With a total of 115 laboratories across disciplines, the institution offers a wide range of practical learning opportunities. Research Infrastructure Advanced Research lab facilities provided to students and staff for developing and honing their research skills. Department of Civil Engineering"}, {"source": "Institutional Development Plan 2024–2029", "page": 35, "text": "Page 35 of 40 Enablers Means to achieve goals ▪ Structural Element Testing Centre ▪ Material Strength Centre ▪ Concrete Research Centre ▪ Centre for Simulation ▪ Environment Centre Department of Electrical and Electronics Engineering ▪ Power Electronics and Drives Research Centre ▪ Power Systems Research Centre ▪ Renewable Energy Lab (DST -FIST sponsored) ▪ Industrial Automation Lab Department of Electronics and Communication Engineering ▪ Centre for Image Processing & Pattern Recognition ▪ Centre for Biomedical Signal / Image Processing ▪ Centre for Robotics and Embedded Systems ▪ Centre for Networking ▪ Centre for VLSI Signal Processing and Mixed Signal Design Department of Computer Science and Engineering ▪ Data Science Research Centre ▪ Big Data Research Centre Department of Mechanica l Engineering ▪ Technology Business Incubators ▪ Centre for CAD ▪ Centre for Manufacturing ▪ Centre for Nano Science ▪"}, {"source": "Institutional Development Plan 2024–2029", "page": 35, "text": "Research Centre Department of Mechanica l Engineering ▪ Technology Business Incubators ▪ Centre for CAD ▪ Centre for Manufacturing ▪ Centre for Nano Science ▪ Center for Safety Department of Information Technology ▪ Centre for Wireless Sensor Networks ▪ Research Centre for Cloud Computing Department of Bio-Technology ▪ Animal Cell Culture Facility ▪ Plant Tissue Culture Laboratory ▪ RNA Biology Laboratory Department of Computer Applications ▪ iOS Application Development Centre ▪ Internet of Things Laboratory"}, {"source": "Institutional Development Plan 2024–2029", "page": 36, "text": "Page 36 of 40 Enablers Means to achieve goals Industry Sponsored Labs The institute nexus with industry has paved way for establishment of Industry Sponsored Laboratories to train students and staff on emerging and industry oriented technologies. Department of Electrical and Electronics Engineering ▪ National Instruments LABVIEW Academy Department of Electronics and Communication Engineering ▪ Mepco Agilent R&D Centre of Excellence in RF Circuit and Antenna Design (partially sponsored by Agilent) ▪ Anechoic Chamber (Sponsored by DST -FIST) ▪ Texas Instruments Innovati on Centre (sponsored by Texas Instruments) ▪ Cisco Networking Academy ▪ IIT Bombay e-Yentra Robotics Centre ( eLSI) ▪ Tessolve Semiconductor Test Engineering Lab ▪ ATMEL AVR MCU Centre Department of Computer Science and Engineering ▪ Private Cloud Centre using Openstack ▪ RedHat Linux Academy Library Library being the primary source of knowledge, it has been equipped with"}, {"source": "Institutional Development Plan 2024–2029", "page": 36, "text": "and Engineering ▪ Private Cloud Centre using Openstack ▪ RedHat Linux Academy Library Library being the primary source of knowledge, it has been equipped with all necessary physical and digital library sources in a perfect comfortable reading and learning ambience. Collection of more than 1.28 lakh books in all domains on 35000 plus titles. Books are being added and updated on a regular basis. Both Print journals and E journals are being subscribed and E journals are accessible for students and staff from anywhere in the campus through the network Computing and IT Infrastructure More than 2600 computing systems are available for both students and staff across the departments and are interconnected with an intranet. All computers are internet connected with 1.5 Gbps bandwidth using a leased line. More than 300 WiFi points being provided in both academic and hostel"}, {"source": "Institutional Development Plan 2024–2029", "page": 36, "text": "All computers are internet connected with 1.5 Gbps bandwidth using a leased line. More than 300 WiFi points being provided in both academic and hostel buildings for easy access o f internet to the campus community. Sports Infrastructure The institution has more than adequate facilities for sports and games (indoor, outdoor). Indoor Sporting Facilities"}, {"source": "Institutional Development Plan 2024–2029", "page": 37, "text": "Page 37 of 40 Enablers Means to achieve goals A multipurpose Indoor Stadium housing 3 Badminton Courts, one Basketball Court, one Volleyball Court and 3 Table Tennis Boards and 150 seating capacity in gallery. A 10 metre Air Rifle Shooting Range with 19 lanes. Outdoor Sporting Facilities 400 meters Standard Track and Field, 5 Volleyball Courts, 2 Basketball Courts, 3 Ball Badminton Courts, 2 Kabaddi Courts, 2 Kho Kho Courts, 2 Handball Courts, 2 Football Fields, 2 Cricket Fields, 2 Cricket Net Practice, 1 Hockey Field, 2 Badminton Courts, 2 Tennikoit Courts, Outdoor Gallery with 800 seating capacity. Other Sports and Fitness Facilities: Skating Zone , Parallel Bars , Horizontal Bar, Roman Ring and Rope Climbing Fitness Facilities A sophisticated Gymnasium with an area of 4500 square feet is functional for housing equipment such as CU Uprite Bike, Chest Press,"}, {"source": "Institutional Development Plan 2024–2029", "page": 37, "text": "Climbing Fitness Facilities A sophisticated Gymnasium with an area of 4500 square feet is functional for housing equipment such as CU Uprite Bike, Chest Press, Latpull Down, Prone Leg Curl, Cable Cross Over, Super Bench (Multi Bench), ABS Machine, Parallel Bar / Tip, AB Trainer, Dumbbell Rack, Incline Bench Press, Curve Sit Up Bench, Shoulder Press /Seated Row, Pearl Delt Pec Fly, Squat Rack, Vertical Plate Tree, Weight Lifting Rod, Hexagon Dumbbells, Adjustable Bench, Olympic Rod 3 feet, Triceps Rope, Nylon Cable Cross Handle, Multi Gym , Hip Abduction / Aduction, Weight Plates (Rubber) etc. Transport Facilities College Buses are operated for students and staff from nearby towns Virudhunagar and Sivakasi. Also, for other administrative and other purposes vehicles are available. An ambulance is in service and two EV vehicles fabricated by students for material transport inside the campus are"}, {"source": "Institutional Development Plan 2024–2029", "page": 37, "text": "and other purposes vehicles are available. An ambulance is in service and two EV vehicles fabricated by students for material transport inside the campus are available. Health Care A separate Dispe nsary with beds and clinical testing facilities is in operation inside the campus. A full time residential Doctor and 3 staff nurses are serving the residents of hostels & quarters and other students. Yoga and Meditation Centre A tranquil space of 890 square meter hall is dedicated for students and staff for practicing yoga and meditation. Training Courses are also offered in this regard periodically. Cultural Infrastructure Institute supports and encourages of students in cultural events and to enable them to practice and perform, the necessary equipment and"}, {"source": "Institutional Development Plan 2024–2029", "page": 38, "text": "Page 38 of 40 Enablers Means to achieve goals accessories are provided. There are enough number of halls to perform such cultural events with all audio, video and music systems. Incubation Centre The Mepco Incubation Centre (MIC), is a registered society established to promote innovation and entrepreneurship by supporting faculty and student start -up initiatives on campus. MIC provides dedicated incubation spaces, including office rooms and a conference hall, within the campus. These spaces are allocated to start -ups at no cost, encouraging innovators to focus on their business development without worrying about operational overheads. The centre also facilitates a collaborative environment, offering physical infrastructure for faculty, students, and alumni -led ventures to ideate, prototype, and launch companies. Hostel Infrastructure 5 hostels for men and 5 hostels for women serve the student residents with all possible amenities and facilities. Guests"}, {"source": "Institutional Development Plan 2024–2029", "page": 38, "text": "and launch companies. Hostel Infrastructure 5 hostels for men and 5 hostels for women serve the student residents with all possible amenities and facilities. Guests Accommodation 1 modern guest house with 38 rooms and another guest house with 10 rooms cater to the needs of guests visiting the campus. Auditorium / Seminar and Conference Halls 12 halls are built for the purpose of using them for big events, meetings, seminars and conferences. Staff Residential Infrastructure Fully furnished Staff Quarters housing 72 families are at the service of staff to get resided within or adjacent to the campus."}, {"source": "Institutional Development Plan 2024–2029", "page": 39, "text": "Page 39 of 40 H. Digital Enablers The institute has initiated and implemented its digital transformation of academic and administrative functions long back and is updating and extending it to all other relevant functions too. These efforts have resulted in quickening the transactions, timely communication, reduction of paper usage and enabling right decision at right time for the stakeholders. Enablers Means to achieve goals Intranet All computers in the campus are connected to a centralized server and people can access the file server from any computer system inside the campus. All academic, student and administrative related activities are integrated through this local area network. Internet All computers are internet connected with 1.5 Gbps bandwidth using a leased line. WiFi Campus More than 300 WiFi points being provided in both academic and hostel buildings for easy access of internet to the"}, {"source": "Institutional Development Plan 2024–2029", "page": 39, "text": "a leased line. WiFi Campus More than 300 WiFi points being provided in both academic and hostel buildings for easy access of internet to the campus community ERP for Learning Management System and Administration The institute has its own indigenously developed ERP system for digital transactions related to the Academic and Administrative work flow. A dedicated team of faculty are involved in this Software Development and they are improving it to suit the latest developments and requirements. This ERP has the following modules in it. I) Administration Modules (25 Sub Modules) II) Academic Modules (113 Sub Modules) III) Faculty and Staff Module (55 Sub Modules) IV) Attainment of PO Through COs Module (30 Sub Module) V) Alumni Module (3 Sub Modules) VI) Library Module (30 Sub Modules) VII) Co-Curricular and Extra-Curricular Activities Module (19 Sub Modules) VIII) Hostel Module (41"}, {"source": "Institutional Development Plan 2024–2029", "page": 39, "text": "V) Alumni Module (3 Sub Modules) VI) Library Module (30 Sub Modules) VII) Co-Curricular and Extra-Curricular Activities Module (19 Sub Modules) VIII) Hostel Module (41 Sub Modules) IX) Store Module (26 Sub Modules) X) Work Section Module (12 Sub Modules) XI) Visitors & Workers Biometric in Out Module (6 Sub Modules) XII) Visiting Faculty Module (9 Sub Modules) Website College maintains a dynamic website (www.mepcoeng.ac.in) with all necessary statutory, mandatory, regulatory and academic information to enable all stakeholders to be aware of the intuitional functioning. Digital Library The MEPCO Digital Library (http ://172.16.16.210/index.php) can be accessed through College Intranet and WiFi connectivity. It contains"}, {"source": "Institutional Development Plan 2024–2029", "page": 40, "text": "Page 40 of 40 NPTEL Videos, NPTEL Web courses, E -Books, MIT Materials and other CFD resources. Paperless Communication All communication to students and staff are mo stly through official emails only. Parents are also connected through SMS and WhatsApp for any kind of news and information sharing. For minimizing paper usage, papers printed on one side are reused for printing on the other side . Digitization of Student applications for admission, Staff application for employment have already been done through website. Feedback and performance appraisal are all done through online only. Digital Transactions Most of the financial transactions among the stakeholders have been made cashless. Digitizing the documents and Certificates All relevant and required documents and certificates of students and staff regularly are kept in the digital format for necessary purposes. Online Certificate Verification System For verifying the students’"}, {"source": "Institutional Development Plan 2024–2029", "page": 40, "text": "documents and certificates of students and staff regularly are kept in the digital format for necessary purposes. Online Certificate Verification System For verifying the students’ credentials for the purpose of employment or Higher Studies by concerned organization, provision is there in the institute’s website itself for easy and quick access. (https://mepcoeng.directverify.in/student/#/app/request) Social Media Presence The institute maintains its presence through social media such as WhatsApp, LinkedIn, Instagram, Facebook and X. Accounts are maintained at the department and faculty level and they are also encouraged to share their professional developments and college events in those media regularly. A social media committee is functional to publish the relevant content for brand building."}, {"source": "Code of Conduct Handbook", "page": 1, "text": "MEPCO SCHLENK ENGINEERING COLLEGE, SIVAKASI (AN AUTONOMOUS INSTITUTION) CODE OF CONDUCT HANDBOOK"}, {"source": "Code of Conduct Handbook", "page": 2, "text": "Page 1 of 22 RULES AND REGULATIONS OF THE COLLEGE & HOSTEL Every student is a responsible citizen to their parents / society / nation and expected that they will follow the rules and regulations of the college and maintain discipline in every aspect. Right from the very inception, the college has been maintaining a high standard of discipline. Students should learn to appreciate the rules and regulations and observe them. Mainly because of high standard of discipline maintained here in curricular, co- curricular and extra-curricular activities, our college is regarded as the best institution by all the stake holders of the society. It is, therefore, the bounden duty and responsibility of all students and staff to uphold the name and reputation of the institution. Any act which brings in defame to the institution is construed to be a misconduct."}, {"source": "Code of Conduct Handbook", "page": 2, "text": "staff to uphold the name and reputation of the institution. Any act which brings in defame to the institution is construed to be a misconduct. The parents / guardians are requested to advise their wards in maintaining the reputation of the institute. The Principal shall have powers to fine, suspend or even expel a student from the college in the interest of the institution under disciplinary action. The final decision of the Principal will never be revoked under any circumstances. No influence or recommendations will have any effect on the college or hostel authorities in this regard. All the students, including day scholars are not allowed to keep mobile phones, digital and film type or any other cameras in their possession during the entire period of their campus life, as the possession/use of them within the campus creates several disciplinary"}, {"source": "Code of Conduct Handbook", "page": 2, "text": "any other cameras in their possession during the entire period of their campus life, as the possession/use of them within the campus creates several disciplinary problems of varied nature. Any photographs in need will be arranged through the college on r equest through the HoD‟s concerned. As di sci pl i nary actions reflect in their conduct certificate, scholarship etc., it is expected that the student will not involve into any unwanted activities. I. Student’s Conduct and Anti-Ragging:  Every student shall conduct himself/herself in every respect to cause no disturbance to the work of the classes or to fellow students. Ragging, consuming alcohol and smoking are strictly prohibited in the college, hostel and even outside the campus. Any violation will result in suspension/ dismissal from the hostel/college. In respect of Ragging, the Special Secretary to Government, Higher Education Department,"}, {"source": "Code of Conduct Handbook", "page": 2, "text": "outside the campus. Any violation will result in suspension/ dismissal from the hostel/college. In respect of Ragging, the Special Secretary to Government, Higher Education Department, Secretariat, and Chennai has given the following Sections in respect of the TamilNadu Prohibition of Ragging Act, 1997."}, {"source": "Code of Conduct Handbook", "page": 3, "text": "Page 2 of 22 Section 4: Whoever direct l y or indirectly commits, participates in, a bets or propagates “ragging” within o r outside any educational institution, shall be punished with imprisonment for a term which may extend to two years and shall also be liable to a fine which may extend to ten thousand rupees. Section 5: Any students convicted of an offence under section 4 mentioned above shall also be dismissed from the educational institution and such student shall not be admitted in any other educational institution.  As per Mepco R2013 and R2015 regulations - Clause 21, every student is required to observe disciplined and decorous behavior both inside and outside the college and not to indulge in any activity which will tend to bring down the prestige of the University / College.  No student shall"}, {"source": "Code of Conduct Handbook", "page": 3, "text": "college and not to indulge in any activity which will tend to bring down the prestige of the University / College.  No student shall take part in any activity of public movement, communal and religious activities which the college authorities consider undesirable.  No organised meeting, tea party, lunch, dinner or any get-together shall be arranged in the college premises or outside without the permission of the Principal.  Students during their stay in the college should not exchange greeting cards, photographs, gift articles, mails or letters with the students of opposite sex. Gossiping of any kind should also be avoided in corridors, sports field, near Vinayagar temple, during Industrial Visits, travel and rehearsal for fine arts etc. Any violation will be seriously dealt with. In case, the relationship develops to undesirable level, individuals involved will be suspended /"}, {"source": "Code of Conduct Handbook", "page": 3, "text": "for fine arts etc. Any violation will be seriously dealt with. In case, the relationship develops to undesirable level, individuals involved will be suspended / dismissed / transferred from the college depending upon the nature of violation.  They are also not allowed to visit the residences of students of other sex. Students who violate the rules will be suspended from the college.  During the class hours, students are forbidden from going to the canteen or loitering along the corridor or road. Any violation will seriously be viewed.  Any unacceptable behaviour seen/vulgar expressions heard, while in the company of fellow students/others will never be left unnoticed. As we wish our students to be professional brand masters, such act will be considered serious."}, {"source": "Code of Conduct Handbook", "page": 4, "text": "Page 3 of 22  Unnecessary loitering around the campus, crowding and discussion at different location are considered undesired activities.  If any grievances are to be brought to the knowledge of higher authorities, standard procedure and means available for getting it redressed. Any common representation through any source or group representation will not be entertained and neglected.  If the students including day scholars who want to go out during regular class / lab hours, coffee/ lunch interval, they should also make their thumb impression in the biometric equipment available near the main gate. In case, prior permission/gate pass has been obtained to leave the campus, the fact should be indicated in the register.  The entries are periodically checked by the Principal. If the entries are found to be false, serious disciplinary action will be taken against the"}, {"source": "Code of Conduct Handbook", "page": 4, "text": " The entries are periodically checked by the Principal. If the entries are found to be false, serious disciplinary action will be taken against the student concerned. For identity, the students should wear the I.D. card in the academic area and also it should be shown to the securit y on duty at the college main gate, if asked for. Hostel students who are stepping out of hostel gates and Dayscholar students who are stepping in main gate should ensure that they wear I.D. cards. II. CLEANLINESS OF THE CAMPUS: An academic institution is a knowledge source and to be used by many of your juniors in the coming years and it is expected that the students should co-operate with the college administration in maintaining the college and hostel premises clean and tidy. It is the wish that the students"}, {"source": "Code of Conduct Handbook", "page": 4, "text": "the students should co-operate with the college administration in maintaining the college and hostel premises clean and tidy. It is the wish that the students should realize the importance of cleanliness and green campus and the environment is maintained pollution free.  Writing on walls, pillars, toilets, bath rooms, and furniture and class room boards is strictly prohibited.  Students should avoid the habit of leaning on the wall or pillars with a foot up anywhere in the corridor of the college building, hostel and also in other places. This sort of practice makes the walls dirty and so the students are advised to refrain from this practice and leave the walls and pillars neat with luster. Leaning on the parapet wall may sometime prove serious injuries if they happen to fall.  Students who buy soft drinks, chocolates etc"}, {"source": "Code of Conduct Handbook", "page": 4, "text": "with luster. Leaning on the parapet wall may sometime prove serious injuries if they happen to fall.  Students who buy soft drinks, chocolates etc in paper packets from the canteen/stores are informed to dispose the empty packets/papers into the dust bins only."}, {"source": "Code of Conduct Handbook", "page": 5, "text": "Page 4 of 22  Waste papers should be dropped only in the dust bins provided. Enough dust bins are provided on the road side and use them for disposing unwanted items.  A class room provides an ambience for studies and a place of worship for your career upliftment. Eating of snacks / lunch / cakes / any eatables inside the class rooms or in the corridor is strictly prohibited. They should have their lunch only in the Day scholar Dining  Rooms for Boys/Girls and in the canteen. III. Care of the College Property: Every student shall handle the college property with diligent care and use it with ownership intent, so that he / she is going to leave the infrastructure for so many future generations to utilize it.  The cost of damage, if caused to the"}, {"source": "Code of Conduct Handbook", "page": 5, "text": "/ she is going to leave the infrastructure for so many future generations to utilize it.  The cost of damage, if caused to the college property, will be charged to the account(s) of the students responsible to the damage in addition to disciplinary action.  Students are advised to switch off the fans and lights when they leave the class rooms as part of conservation of precious energy.  Furniture in the classrooms should not be moved and displaced. Over Head / LCD Projectors kept in the class rooms should not be meddled with.  Writing on the desks, defacing the furniture in the class rooms / seminar halls / conference halls etc. should be avoided and students are expected to maintain them for their longer life. Any violation will be viewed very seriously. IV. Dress Code: As dressing"}, {"source": "Code of Conduct Handbook", "page": 5, "text": "be avoided and students are expected to maintain them for their longer life. Any violation will be viewed very seriously. IV. Dress Code: As dressing maketh a man, students should be decently dressed up while attending classes and moving wherever inside the campus.  Girls can only wear either saree or churidhar to the class and other occasions including their visit to the campus as alumni.  Boys must be clean shaven at all times and should definitely refrain from loitering in the campus or coming to class room or to any of the college functions wearing jeans, shorts, dhoti, lungi, T-Shirts without collar, shirts / T-Shirts with printed sceneries or"}, {"source": "Code of Conduct Handbook", "page": 6, "text": "Page 5 of 22 write up and by any other fancy dress. Also radical hair styles / fade haircut hair styles are not permitted.  Students found violating the dress code will be sent out of the class by the teacher concerned and this will be brought to the Principal for further appropriate action. V. Traffic Rules:  Users of vehicles should have a valid driving license and they should apply and obtain “Vehicle Pass”. The Riders of two wheelers should wear a correct size helmet.  Students are strictly advised not to ride or drive two wheelers or four wheelers fast anywhere and especially inside the campus. They should not carry more than one pillion rider.  All vehicles inside the campus have to be parked in an orderly manner only in the space Provided for them.  In"}, {"source": "Code of Conduct Handbook", "page": 6, "text": "pillion rider.  All vehicles inside the campus have to be parked in an orderly manner only in the space Provided for them.  In case, anybody is found violating any of the traffic rules, a fine of Rs.1000/- will be levied and also the vehicle will be confiscated for a minimum period of one week.  During class hours no vehicle will be permitted inside the campus as this would disturb the academic activities. VI. Educational Tours, Industrial Visits and Festivals:  Students should not make any noise just before leaving or returning from educational Tours. No dancing /shouting / whistling in the bus inside / outside the campus.  No fooling around is allowed on the first day of April or in the name of birthdays or any other Occasions.  Using crackers in the college or hostel"}, {"source": "Code of Conduct Handbook", "page": 6, "text": "allowed on the first day of April or in the name of birthdays or any other Occasions.  Using crackers in the college or hostel premises is strictly forbidden at any time.  In the name of Holi Festival/or any other festival/farewell party, last working day, etc. throwing colour powder or spraying colour water on others/on walls is strictly prohibited. VII. Functions and Meetings: When all the students are expected to attend college functions like Sports Day, College Day, Hostel Day, etc. without fail, no student should stay back in the hostels and they should leave the hostels well in advance to attend the functions in time."}, {"source": "Code of Conduct Handbook", "page": 7, "text": "Page 6 of 22 o In the valedictory function of associations and clubs, awards/certificates/mementos will be distributed in the presence of all the faculty members of the respective department. There would not be any separate farewell party either inside the campus or outside. o Students should neither leave in the middle of the proceedings of any meeting, nor be seen in any place other than the meeting premises.  Students are not to shout, hoot, whistle or make any such disturbance during the functions like the College Day, Hostel Day, and Sports Day or during inter-collegiate competitions, association meetings, guest lectures, etc.  They are also advised to refrain from sitting on the pavement during any function held at the auditorium or anywhere else or during normal days.  Any photographs required by the students will be taken by the"}, {"source": "Code of Conduct Handbook", "page": 7, "text": "any function held at the auditorium or anywhere else or during normal days.  Any photographs required by the students will be taken by the college authorities on request. Handling of any type of cameras inside the campus is prohibited. III. Hostel Students: Hostel is a temporary home to a student during his/her studies and we wish their stay is available with required comfort and convenience. When they are away from their parents we want the students to understand their responsibility as an individual and adjusting with neighbors, without causing inconvenience to his /her inmates. They have to understand that their temporary stay in the hostels during their tenure of study is meant for understanding others, improving their academic activities and grooming themselves a responsible individual. Being a temporary accommodation it is essential that they have to keep the accommodation"}, {"source": "Code of Conduct Handbook", "page": 7, "text": "others, improving their academic activities and grooming themselves a responsible individual. Being a temporary accommodation it is essential that they have to keep the accommodation provided to them available in the same way in a neat and proper condition to their juniors in the years to come. If they feel that it will be a difficult task to follow they need not opt for hostel accommodation. (Detailed rules and regulations will be issued to the inmates when they get accommodation)  Hostel students shall keep their rooms neat and tidy.  No student shall remain in the hostel during class hours unless he/she is sick as certified by RMO and permitted to avail leave.  Sick students must necessarily consult the doctor and produce the medical certificate to the staff advisor while applying for leave on medical grounds."}, {"source": "Code of Conduct Handbook", "page": 8, "text": "Page 7 of 22  The residents of the Boys‟ hostel should record his thumb impression in the biometric equipments while leaving / entering the college main gate in the evening. After outing in the evening they should return back before 7.00 p.m., else, a SMS will be sent to their Parents automatically.  If the automated identification/recording system is in use, proper ID Card/any other means necessary for their entry/leaving records should be done whenever needed in a very diligent manner.  The resident girl students should be inside the hostel before 6.30 pm even if they travel long distances after leave or any other permitted activities.  Resident girl students are permitted to leave the hostels only with their parents or authorized person after showing the hostel ID card issued to them between 6.00 am and 6.00 pm."}, {"source": "Code of Conduct Handbook", "page": 8, "text": "leave the hostels only with their parents or authorized person after showing the hostel ID card issued to them between 6.00 am and 6.00 pm.  Accommodation will be given only to unmarried students. If the student is getting married in the middle of the course, she/he has to vacate the hostel.  Enough communication facilities have been provided and use of mobile phone is banned."}, {"source": "Code of Conduct Handbook", "page": 9, "text": "Page 8 of 22 EXAMINATIONS Internal Test & Assessment: Periodically, tests and assignments will be given in all subjects. The students shall write all the tests and submit the assignments in time. Performance in the tests and attendance will be taken into consideration while evaluating the progress of students as per the autonomous norms. In case, the progress of student is poor and fails in a number of subjects in each i n t e r n a l test, the student‟s parent will be informed so that the student improves his performance. End Semester Examinations: End Semester examinations will normally be held in November/December and April/May at the end of odd and even semesters. Internal marks, external end semester exam marks and passing minimum will be based on the corresponding regulations. Time limit for the completion of B.E. course"}, {"source": "Code of Conduct Handbook", "page": 9, "text": "Internal marks, external end semester exam marks and passing minimum will be based on the corresponding regulations. Time limit for the completion of B.E. course is 7 years. Students have to take without fail all the necessary materials such as hall ticket, ID card, pen, pencil, appropriate calculator, scale, rubber etc. to the test / exam hall. Permission will not be given to borrow these items from neighbors under any circumstances. The students are not permitted for possessing Smart Watches, Digital Watches, Programmable Calculators, and any other Electronics Storage devices inside the Examination Halls. Violation of the above instruction in any form during the examinations will be treated as malpractice. Any student failing in two or more than three subjects will be warned by the Staff adviser / HOD concerned respectively. In case, any one fails in all the subjects,"}, {"source": "Code of Conduct Handbook", "page": 9, "text": "or more than three subjects will be warned by the Staff adviser / HOD concerned respectively. In case, any one fails in all the subjects, he/she accompanied by parent should meet the Principal and give an assurance in writing for better performance in the future. Revaluation Facility / Photo Copying of the Answer Sheets as per University Norms: Candidates can apply for photo copy of the answer sheets/ challenge valuation on payment of the prescribed fee per paper to the COE (Autonomous) through the college office as per the norms. Defective and late applications will summarily be rejected."}, {"source": "Code of Conduct Handbook", "page": 10, "text": "Page 9 of 22 Certificates: A student desiring to obtain any certificate or extract from the college records or certificate attestation shall apply for it on payment of appropriate fee towards the charges and the certificates/extract may be collected from the college office after 24 hours. Application for a certificate should be addressed to the Principal through the HoDs concerned. No certificate will be sent by post unless necessary fee and self-addressed stamped envelope are sent together with the application."}, {"source": "Code of Conduct Handbook", "page": 11, "text": "Page 10 of 22 LIBRARY GENERAL RULES: The Library is kept open from 8.00 am to 7.00 pm on week days. The Library is also open on Sundays from 10.00 am to 4.00pm and will be closed on HOLIDAYS. E-Learning Centre 8.30 a.m to 6.30 p.m 1. Readers desirous of using the library shall enter in the electronic registry / register, at the entrance to the Library while entering / leaving. This shall be regarded as acceptance of the rules of the library by the person concerned. 2. Readers shall not write on, damage or make any mark on any book, manuscript or map belonging to the library. No tracing or mechanical reproduction shall be made without the permission of the librarian. 3. Silence shall be strictly observed in the library premises. 4. Before leaving the library, readers shall return"}, {"source": "Code of Conduct Handbook", "page": 11, "text": "made without the permission of the librarian. 3. Silence shall be strictly observed in the library premises. 4. Before leaving the library, readers shall return to the assistant at the counter, the books, manuscripts and maps which they have taken from him. All other publications taken out from stacks should be left on the reading table. The library staff will replace them. 5. Readers shall be responsible for any damage or injury done to the books belonging to the library and may be required to replace such books damaged. If one book of a set is damaged by the borrower or reader may be called upon to replace the whole set. In case of loss of any book, the borrower is required to replace by another latest edition copy, with overdue charges. Under no circumstance the barcode slips pasted on"}, {"source": "Code of Conduct Handbook", "page": 11, "text": "of any book, the borrower is required to replace by another latest edition copy, with overdue charges. Under no circumstance the barcode slips pasted on the books or Identity cards should be defaced. A fine of Rs.100/- will be levied if the barcode slip is found damaged or defaced. 6. Cases of inactivity on the part of the library staff or any fault in the service rendered should be reported immediately to the Librarian. 7. Personal copies, printed materials, sticks, umbrellas, boxes and such other materials shall be left in the personal belongings counter in the library."}, {"source": "Code of Conduct Handbook", "page": 12, "text": "Page 11 of 22 8. Each registered member will be allowed to borrow the following number of books: Staff Student i Professor & Head 10 i U.G. Students (I Year) 4 ii Faculty 12 ii U.G. Students (II & III Year) 6 iii Research Fellow 5 iii U.G. Students (Final Year) 6 iv Non-Teaching Staff (Excluding Attenders) 2 iv P.G. Students 6 v Attenders 1 v Ph.D Students 8 Principal has discretionary powers to increase additional issue of books to whomsoever he feels necessary. The Loan period for the faculty is one semester and for the students 30 days. 9. A book or a volume will be lent to a member on production of identity card. Before leaving the counter, the member must satisfy himself that the book lent to him is in good condition, and if not, he must"}, {"source": "Code of Conduct Handbook", "page": 12, "text": "card. Before leaving the counter, the member must satisfy himself that the book lent to him is in good condition, and if not, he must immediately bring the matter to the notice of the Librarian or in his absence to the Senior member of the Library staff present. Otherwise, he is liable to be held responsible for the damage of the books and may be called upon to replace the book. 10. Books borrowed shall be returned at the expiry of the due date, which will be stamped on the books received back. The loan may however, be renewed for a further period provided no other member has applied for it in the meantime. 11. In case there are three or more registered requests for loan at a time for a book, the period of loan shall be reduced to"}, {"source": "Code of Conduct Handbook", "page": 12, "text": "In case there are three or more registered requests for loan at a time for a book, the period of loan shall be reduced to one week, if deemed necessary. Notwithstanding the above, the Librarian will have the discretionary power to relax it, if he considers it necessary. 12. Dictionaries, back volumes, project reports and other reference books which might be difficult to replace, will not normally be lent. All such materials shall be referred to within the Library. However reference books and other such materials if absolutely required will"}, {"source": "Code of Conduct Ha
