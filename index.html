sts/circulars, managing visitors and public relations with outside organisations like University, AICTE, etc."}, {"source": "Code of Conduct Handbook", "page": 19, "text": "Page 18 of 22 RESPONSIBILITIES OF OTHER TEACHING FACULTY Other teaching faculty includes professors, associate professors, assistant professors, SG lecturers senior lecturers and lecturers. Their responsibilities are spelt out in the following terms: 1. Assisting the Head of the Department in all academic and non-academic matters and carrying out all the assignments assigned by the Head of the Department. 2. Planning and executing everything for the completion of syllabus including practicals project works and other lab programmers 3. Entering the students ‘attendance/activities into the office server. 4. Valuating answer papers and submitting marks for all tests within the stipulated periods communicated. 5. Participating in the conduct of the university examinations as invigilators and examiners wherever called for. 6. Taking up the responsibilities of the Head of the Department in his/her absence, when asked for. 7. Leading students on specific assignments"}, {"source": "Code of Conduct Handbook", "page": 19, "text": "called for. 6. Taking up the responsibilities of the Head of the Department in his/her absence, when asked for. 7. Leading students on specific assignments such as educational tours, industrial visits, co- curricular and extra-curricular activities. 8. Maintaining discipline and decorum in the campus on their part and on the part of students. 9. Taking assignments like sub-warden ship and faculty advisor to students/clubs. 10. Participating in seminars, summer schools, winter schools, refresher courses, research, etc. 11. Becoming members in professional organisations and to be familiar with latest development in their respective fields."}, {"source": "Code of Conduct Handbook", "page": 20, "text": "Page 19 of 22 RESPONSIBILITIES OF THE PHYSICAL DIRECTOR 1. Planning/scheduling fo ures for the inmates. 8. Preparation of annual budget for the hostels. 9. Maintenance of adequate staff at all levels in the hostel. 10. Receiving feedbacks and undertaking correction effort in all areas of hostel administration. 11. Passing the mess bills every month and forwarding the same to the Warden."}];

const stopWords = new Set(("the a an and or is are was were be to of in on for from with what which who how why can could should would do does did are you we they it this that these those about as at by into during regarding").split(" "));

function tokenize(s){
  return s.toLowerCase()
    .replace(/[^a-z0-9₹]+/g," ")
    .split(/\s+/)
    .filter(w=>w.length>2 && !stopWords.has(w));
}

function score(question, text){
  const q = tokenize(question);
  const t = tokenize(text);
  const counts = {};
  t.forEach(w => counts[w]=(counts[w]||0)+1);
  let score = 0;
  q.forEach(w=>{
    if(counts[w]) score += 1 + Math.min(counts[w],3)*0.15;
  });
  // Extra phrase matching
  const ql=question.toLowerCase(), tl=text.toLowerCase();
  if(ql.includes("cracker") && tl.includes("crackers")) score += 8;
  if(ql.includes("mobile") && tl.includes("mobile phones")) score += 8;
  if(ql.includes("vision") && tl.includes("vision")) score += 8;
  if(ql.includes("mission") && tl.includes("mission")) score += 8;
  if(ql.includes("eating") && tl.includes("eating")) score += 7;
  if(ql.includes("ragging") && tl.includes("ragging")) score += 7;
  return score;
}

function retrieve(question){
  return documents.map(d=>({...d,score:score(question,d.text)}))
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,4);
}

function answer(question){
  const results=retrieve(question);
  if(!results.length || results[0].score < 1.5)
    return {text:"I could not find this information in the supplied documents.", sources:[]};

  // Return the strongest retrieved passages rather than inventing an answer.
  const selected=results.slice(0,2);
  const text=selected.map(x=>x.text).join("\n\n");
  const unique=[];
  selected.forEach(x=>{
    const s=`${x.source} — Page ${x.page}`;
    if(!unique.includes(s)) unique.push(s);
  });
  return {text, sources:unique};
}

function addMessage(text, cls, sources=[]){
  const box=document.createElement("div");
  box.className="msg "+cls;
  box.textContent=text;
  if(sources.length){
    const src=document.createElement("div");
    src.className="source";
    src.textContent="Source: "+sources.join(" | ");
    box.appendChild(src);
  }
  document.getElementById("chat").appendChild(box);
  const chat=document.getElementById("chat");
  chat.scrollTop=chat.scrollHeight;
}

function ask(q){
  const input=document.getElementById("question");
  const question=(q || input.value).trim();
  if(!question) return;
  addMessage(question,"user");
  input.value="";
  const result=answer(question);
  addMessage(result.text,"bot",result.sources);
}
